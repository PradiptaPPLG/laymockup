<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>LayMockup × PixelCam — 3D Isometric Mockup Studio</title>
  <!-- LayMockup Session Intro Guard -->
  <!-- Intro hanya diputar 1x saat awal buka website dalam sesi browser ini -->
  <!-- Setiap kali refresh (F5) atau klik kembali ke Beranda TIDAK AKAN mengulang intro -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('laymockup_intro_seen') === '1') {
          document.documentElement.classList.add('skip-intro');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    html.skip-intro #intro-overlay {
      display: none !important;
    }
  </style>

  <meta name="description"
    content="Studio 3D Isometric Mockup berbasis browser hasil kolaborasi LayMockup × PixelCam. Ubah screenshot produk menjadi mockup isometrik 3D elegan dalam hitungan detik di HP maupun Desktop.">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23111111'><rect width='24' height='24' rx='6'/><path d='M12 4l7 4-7 4-7-4 7-4zm-7 7l7 4 7-4m-14 4l7 4 7-4' stroke='%23ffffff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">

  <!-- Preconnect Google Fonts for Caveat cursive script (Laymockup signature) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       PIXELCAM × LAYMOCKUP DESIGN SYSTEM — FULLY RESPONSIVE
       Minimal Apple-inspired typography, subtle white blueprint grid,
       clean 16px rounded cards, and touch-optimized mobile layout.
       ============================================================ */
    :root {
      --bg: #fafafa;
      --fg: #111111;
      --fg-muted: #6b7280;
      --fg-subtle: #9ca3af;
      --border-color: #e5e7eb;
      --border-hover: #d1d5db;
      --card-bg: #ffffff;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-light: #eef2ff;
      --emerald: #10b981;
      --emerald-light: #ecfdf5;
      --grid-color: rgba(99, 102, 241, 0.05);

      --radius-sm: 8px;
      --radius-btn: 14px;
      --radius-card: 16px;
      --radius-large: 24px;
      --radius-full: 9999px;

      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.07);
      --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.09);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden !important;
      width: 100% !important;
      max-width: 100% !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      background-color: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      /* Subtle blueprint grid background */
      background-image:
        linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
      background-size: 24px 24px;
      overflow-x: hidden !important;
      width: 100% !important;
      max-width: 100% !important;
      position: relative;
      margin: 0;
      padding: 0;
    }

    /* Links & selections */
    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background-color: rgba(79, 70, 229, 0.15);
      color: var(--fg);
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin-left: auto !important;
      margin-right: auto !important;
      padding-left: 20px;
      padding-right: 20px;
      box-sizing: border-box !important;
    }

    /* Top Announcement Ribbon */
    .top-ribbon {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
      color: var(--fg-muted);
      text-align: center;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }

    .top-ribbon strong {
      color: var(--fg);
    }

    .top-ribbon .badge-sparkle {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: var(--radius-full);
      font-weight: 600;
      font-size: 11px;
    }

    /* Header & Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(250, 250, 250, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      transition: all 0.2s ease;
      width: 100%;
    }

    .nav-inner {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
      color: var(--fg);
      flex-shrink: 0;
    }

    .brand-logo-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand-icon-box {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      background: #f3f4f6;
      color: #4b5563;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 500;
      color: var(--fg-muted);
      transition: color 0.15s ease;
    }

    .nav-links a:hover {
      color: var(--fg);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Mobile Controls in Navbar */
    .mobile-controls {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .mobile-quick-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 10px;
      background: #111111;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      border: none;
    }

    .mobile-menu-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--fg);
      outline: none;
      transition: all 0.15s ease;
    }

    .mobile-menu-btn:active {
      background: #f3f4f6;
      transform: scale(0.96);
    }

    .mobile-menu-btn svg {
      transition: transform 0.2s ease;
    }

    /* Mobile Drawer */
    .mobile-nav-drawer {
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
      padding: 16px 20px 24px 20px;
      z-index: 49;
      transform: translateY(-110%);
      opacity: 0;
      pointer-events: none;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .mobile-nav-drawer.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 48;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .mobile-menu-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-nav-links {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mobile-nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      color: var(--fg);
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s ease;
    }

    .mobile-nav-link:active {
      background: #eef2ff;
      border-color: var(--accent);
    }

    .mobile-nav-link .icon {
      font-size: 18px;
    }

    .mobile-nav-link .sub {
      font-size: 11px;
      font-weight: 400;
      color: var(--fg-muted);
    }

    .mobile-nav-cta {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
    }

    .mobile-nav-cta .btn {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: var(--radius-btn);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s ease;
      cursor: pointer;
      border: 1px solid transparent;
      outline: none;
      white-space: nowrap;
      text-align: center;
    }

    .btn-primary {
      background: #111111;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .btn-primary:hover {
      background: #262626;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #ffffff;
      border-color: var(--border-color);
      color: var(--fg);
      box-shadow: var(--shadow-xs);
    }

    .btn-secondary:hover {
      background: #f9fafb;
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .btn-emerald {
      background: #ffffff;
      border-color: rgba(16, 185, 129, 0.35);
      color: #065f46;
      box-shadow: var(--shadow-xs);
    }

    .btn-emerald:hover {
      background: var(--emerald-light);
      border-color: var(--emerald);
      transform: translateY(-1px);
    }

    .btn-lg {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: var(--radius-btn);
    }

    /* Section Header common style */
    .section-header {
      text-align: center;
      margin-bottom: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .section-overline {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--fg-muted);
    }

    .section-title {
      font-size: clamp(26px, 4.2vw, 42px);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.18;
      color: var(--fg);
    }

    .section-desc {
      font-size: 15px;
      color: var(--fg-muted);
      max-width: 600px;
      line-height: 1.6;
    }

    /* Hero Section */
    .hero-section {
      padding: 60px 0 70px 0;
      text-align: center;
      position: relative;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      box-sizing: border-box;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: #ffffff;
      border: 1px solid var(--border-color);
      font-size: 12px;
      font-weight: 600;
      color: var(--fg-muted);
      box-shadow: var(--shadow-xs);
      margin: 0 auto 22px auto;
      max-width: calc(100% - 24px);
      line-height: 1.4;
      text-align: center;
      word-break: break-word;
      box-sizing: border-box;
    }

    .hero-pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
      flex-shrink: 0;
    }

    .hero-title {
      font-size: clamp(28px, 5.2vw, 56px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.15;
      color: var(--fg);
      max-width: 920px;
      margin: 0 auto 18px auto;
      word-break: break-word;
      overflow-wrap: break-word;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }

    .hero-title span.gradient-text {
      background: linear-gradient(135deg, #111111 20%, #4f46e5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      font-size: clamp(15px, 2vw, 18px);
      color: var(--fg-muted);
      max-width: 660px;
      margin: 0 auto 32px auto;
      line-height: 1.6;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 0 auto 40px auto;
      width: 100%;
      box-sizing: border-box;
    }

    /* Etalase Section */
    .etalase-section {
      padding: 60px 0 80px 0;
    }

    .etalase-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
    }

    .etalase-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .etalase-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-4px);
      border-color: #d1d5db;
    }

    .etalase-card.featured {
      border-color: rgba(79, 70, 229, 0.35);
    }

    .etalase-preview-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      min-height: 200px;
      background: #edf2f7;
      border-bottom: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .etalase-preview-box canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .etalase-badge-top {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-color);
      font-size: 11px;
      font-weight: 600;
      color: var(--fg);
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: var(--shadow-xs);
      z-index: 2;
    }

    .etalase-badge-top.emerald {
      background: rgba(236, 253, 245, 0.95);
      border-color: rgba(16, 185, 129, 0.3);
      color: #065f46;
    }

    .etalase-content {
      padding: 26px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .etalase-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .etalase-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    .etalase-tag.emerald {
      color: #059669;
    }

    .etalase-title {
      font-size: 21px;
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .etalase-description {
      font-size: 14px;
      color: var(--fg-muted);
      line-height: 1.6;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 14px 16px;
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 22px;
    }

    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .spec-key {
      font-size: 11px;
      color: var(--fg-subtle);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .spec-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
    }

    .etalase-btn-wrap {
      display: flex;
      align-items: center;

      gap: 10px;
    }

    .etalase-btn-wrap .btn {
      flex: 1;
    }

    /* Features Section — Exactly like PixelCam */
    .features-section {
      padding: 70px 0 86px 0;
      background: #fafafa;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .feature-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 18px;
      cursor: default;
    }

    .feature-card:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
      transform: translateY(-4px);
    }

    .feature-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .feature-card:hover .feature-icon-box {
      background: #eef2ff;
      color: #4f46e5;
    }

    .feature-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .feature-title {
      font-size: 15px;
      font-weight: 600;
      color: #111111;
      letter-spacing: -0.01em;
    }

    .feature-desc {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
    }

    /* Comparison Table Section */
    .compare-section {
      padding: 60px 0 80px 0;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      box-sizing: border-box;
    }

    .mobile-scroll-hint {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
      width: 100%;
    }

    .compare-table-wrap {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch;
      box-shadow: var(--shadow-sm);
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      display: block;
    }

    .compare-table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      text-align: left;
    }

    .compare-table th,
    .compare-table td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }

    .compare-table th {
      background: #f9fafb;
      font-weight: 700;
      color: var(--fg);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .compare-table tr:last-child td {
      border-bottom: none;
    }

    .compare-table tr:hover td {
      background: #fafafa;
    }

    .compare-table td.feature-name {
      font-weight: 600;
      color: var(--fg);
      width: 32%;
    }

    .compare-table td.tag-active {
      color: var(--accent);
      font-weight: 600;
    }

    /* How It Works Section */
    .steps-section {
      padding: 60px 0 80px 0;
      background: #fafafa;
    }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .step-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 26px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .step-num {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #111111;
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.01em;
    }

    .step-desc {
      font-size: 14px;
      color: var(--fg-muted);
      line-height: 1.6;
    }

    /* CTA Bottom Banner */
    .cta-section {
      padding: 70px 0;
    }

    .cta-card {
      background: #111111;
      border-radius: var(--radius-large);
      padding: 56px 36px;
      text-align: center;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    .cta-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    .cta-card-inner {
      position: relative;
      z-index: 2;
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .cta-title {
      font-size: clamp(26px, 4vw, 38px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .cta-desc {
      font-size: 15px;
      color: #9ca3af;
      line-height: 1.6;
    }

    .cta-btns {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }
